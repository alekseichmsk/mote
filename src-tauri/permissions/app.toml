  "spell_check_selection",
  "layout_fix",
  "layout_auto_get",
  "layout_auto_set",
  "spell_clear_target",
  "spell_ignore_add",
  "llm_status",
  "llm_set_device",
  "llm_download_model",
  "llm_improve_text",
  "llm_improve_selection",
  "weather_now",
  "curious_number_fact",
  "curious_date_fact",
  "curious_quote",
