  "show_main_window",
  "hide_main_window",
  "set_always_on_top",
  "set_presence_paused",
  "set_presence_enabled",
  "mark_user_placed",
  "shoo_away",
  "enter_rage_mode",
  "exit_rage_mode",
  "media_control",
  "media_volume_get",
  "media_volume_set",
  "digit_copy",
